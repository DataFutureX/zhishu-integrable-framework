# 生产环境
spring:
  config:
    activate:
      on-profile: prod

server:
  port: ${SERVER_PORT:8080}

# 数据库（生产）—— 敏感信息务必通过环境变量注入，勿将真实密码提交仓库
yunqi:
  datasource:
    host: ${YUNQI_DB_HOST}
    port: ${YUNQI_DB_PORT:3306}
    database: ${YUNQI_DB_NAME:yunqi_admin}
    username: ${YUNQI_DB_USERNAME}
    password: ${YUNQI_DB_PASSWORD}
    params: useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false
    pool:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  captcha:
    enabled: true
  login-crypto:
    enabled: true

logging:
  level:
    root: WARN
    cn.datafuturex.yunqi: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
