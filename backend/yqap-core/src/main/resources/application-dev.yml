# 开发环境
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true

server:
  port: 8080

# 数据库（开发）
yunqi:
  security:
    # 开发模式：放行 API 文档相关路径
    api-docs-permit-all: true
  datasource:
    host: localhost
    port: 3306
    database: yunqi_admin
    username: root
    password: 12345678
    params: useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    pool:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    cn.datafuturex.yunqi: DEBUG
