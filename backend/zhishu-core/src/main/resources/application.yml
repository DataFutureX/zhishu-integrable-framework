spring:
  application:
    name: zhishu
  # 默认开发环境；可通过 --spring.profiles.active=test|prod 或环境变量 SPRING_PROFILES_ACTIVE 切换
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,ai}

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  # Jackson 3（Boot 4）：日期默认已是字符串而非时间戳；自定义格式与时区如下
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # MyBatis-Plus 配置
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

# JWT 配置（各环境可覆盖 secret）
jwt:
  secret: zhishu-secret-key-for-jwt-token-generation-2024
  expiration: 86400000  # 24小时（毫秒）

# SpringDoc (Swagger) 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 日志配置（控制台/文件分流策略见 logback-spring.xml）
logging:
  file:
    name: logs/zhishu-backend.log

# 业务公共配置（数据库、端口见 application-{dev|test|prod}.yml）
yunqi:
  security:
    # 是否放行 Swagger/Knife4j 文档路径；默认关闭，开发环境见 application-dev.yml
    api-docs-permit-all: false
  upload:
    path: uploads
  captcha:
    enabled: true
    expire-seconds: 120
    token-expire-seconds: 300
    tolerance: 5
  login-crypto:
    enabled: true
    key-size: 2048
    key-expire-seconds: 300
  # 伙伴 SSO（Ticket 换票）；开发默认开启，生产见 application-prod.yml
  sso:
    enabled: true
    audience: zhishu-integrable-framework
    clock-skew-seconds: 30
    jti-ttl-seconds: 180
    default-redirect: /home/dashboard
    rate-limit-window-seconds: 60
    rate-limit-max-requests: 30
    partners:
      wanxiang:
        enabled: true
        issuer: wanxiang
        display-name: 万象
        algorithm: RS256,SM2
        public-key: classpath:sso/wanxiang.pem
        public-keys:
          wanxiang-2026: classpath:sso/wanxiang.pem
        ticket-ttl-max-seconds: 120
        username-claim: username
      shuzhi-iot:
        enabled: true
        issuer: shuzhi-iot
        display-name: 数智IoT
        algorithm: RS256,SM2
        public-key: classpath:sso/shuzhi-iot.pem
        public-keys:
          shuzhi-iot-2026: classpath:sso/shuzhi-iot.pem
        ticket-ttl-max-seconds: 120
        username-claim: username
  # 月分表监控与预建（操作日志等）
  table-sharding:
    enabled: true
    strategies:
      - name: operation-log
        display-name: 操作日志
        table-prefix: sys_operation_log_
        template-table: sys_operation_log
        months-behind: 6
        months-ahead: 1
        auto-create: true
