# 透传给后端的请求头集合。
# nginx 的 proxy_set_header 继承规则是"全有或全无"：某个 location 只要定义了自己的
# proxy_set_header，就不再继承 server 级的全部同类指令，必须把这份片段一起 include 进来。
#
# 关键教训：Host 头一定要覆盖。若不覆盖，nginx 会用 proxy_pass 的目标名当 Host，
# 而 upstream 名 zhishu_backend 含下划线，Tomcat 会直接判定非法并返回 400（请求根本进不到应用）。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
