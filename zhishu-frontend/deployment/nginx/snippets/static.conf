# 静态资源与 SPA 回退片段：在 server 块内 include（站点根为 /usr/share/nginx/html = 宿主机 ./web）

index   index.html;
charset utf-8;

gzip            on;
gzip_vary       on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types      text/plain text/css text/javascript application/javascript
                application/json application/manifest+json image/svg+xml;

# 供容器健康检查使用，不依赖 web/ 是否已放产物
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# 入口文件不缓存：换包后浏览器立刻拿到引用新 hash 资源的 index.html
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Vite 产物文件名带内容 hash，可长期强缓存
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# createWebHistory：非文件路径一律回退到入口
location / {
    try_files $uri $uri/ /index.html;
}
