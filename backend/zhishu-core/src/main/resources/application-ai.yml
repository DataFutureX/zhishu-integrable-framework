# zhishu-ai 同进程配置（由 zhishu-core 引入，勿单独启动 :8180）
spring:
  config:
    activate:
      on-profile: ai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: postgresql
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:qwen-plus}
          temperature: 0.7
          max-tokens: 2000
          top-p: 0.9
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:qwen3.7-text-embedding}
          dimensions: 1024
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        enabled: ${ZHISHU_MCP_SERVER_ENABLED:true}
        protocol: STREAMABLE
        name: zhishu-integrable-framework
        version: 1.0.0
        type: SYNC
        tool-callback-converter: true
        expose-mcp-client-tools: false
        streamable-http:
          mcp-endpoint: /mcp
      client:
        enabled: true
        type: SYNC
        toolcallback:
          enabled: true

wanxiang:
  mcp:
    server-enabled: false
  agent:
    engine: ${WANXIANG_AGENT_ENGINE:chatclient}
  kg:
    # 默认关闭；配置 Neo4j 后设置 WANXIANG_KG_ENABLED=true 启用 GraphRAG
    enabled: ${WANXIANG_KG_ENABLED:false}
    neo4j:
      uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
      database: ${NEO4J_DATABASE:neo4j}

zhishu:
  briefing:
    event-scan:
      enabled: false
    mail:
      jdbc-enabled: false
    webhook:
      enabled: true
      url: ${ZHISHU_BRIEFING_WEBHOOK_URL:http://127.0.0.1:8080/api/v1/internal/briefings/notify}
      api-key: ${ZHISHU_BRIEFING_WEBHOOK_KEY:dev-briefing-webhook-key}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.datafuturex.assistant: INFO
    org.springframework.ai: INFO
