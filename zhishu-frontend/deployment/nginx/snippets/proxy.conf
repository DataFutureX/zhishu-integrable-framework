# 反向代理片段：在 server 块内 include。
# upstream 名称 zhishu_backend 由 default.conf.template 里的 upstream 块定义（地址来自 .env 的 BACKEND_UPSTREAM）。
# 这里刻意不用变量拼 proxy_pass，避免 nginx 走运行时 DNS 解析（host.docker.internal 只在 /etc/hosts，
# 容器内嵌 DNS 解析不到）。

# 后端 multipart 上限为 10MB（spring.servlet.multipart.max-*），网关侧留一倍余量
client_max_body_size 20m;

proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 上传件：后端资源处理器挂在 /uploads/**（WebMvcConfig），
# 而前端 src/utils/asset.ts 会拼出 /api/uploads/**，两种写法都要接住
location ^~ /api/uploads/ {
    proxy_pass http://zhishu_backend/uploads/;
}
location ^~ /uploads/ {
    proxy_pass http://zhishu_backend;
}

# MCP：后端端点是 /mcp（SecurityConfig 放行 /mcp 与 /mcp/**），
# McpHub 页面展示的入口地址会带 /api 前缀，因此同样做一次映射
location ^~ /api/mcp {
    proxy_pass http://zhishu_backend/mcp;
}
location ^~ /mcp {
    proxy_pass http://zhishu_backend;
}

# 业务接口：后端路由自带 /api 前缀（无 context-path），所以不改写 URI 直接透传。
# 公告 SSE（/api/v1/announcements/stream）与 AI 流式对话都走这里：
# 必须关缓冲并拉长读超时，否则首包被攒住、长连接会被网关提前切断。
location ^~ /api/ {
    proxy_pass http://zhishu_backend;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Connection '';
}

# API 文档：application-prod.yml 默认关闭 springdoc，保留转发只为临时排查
location ^~ /swagger-ui/  { proxy_pass http://zhishu_backend; }
location ^~ /v3/api-docs/ { proxy_pass http://zhishu_backend; }
location ^~ /webjars/     { proxy_pass http://zhishu_backend; }
