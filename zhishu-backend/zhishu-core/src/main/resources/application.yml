spring:
  application:
    name: zhishu
  # 默认开发环境；可通过 --spring.profiles.active=test|prod 或环境变量 SPRING_PROFILES_ACTIVE 切换
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  # Jackson 3（Boot 4）：日期默认已是字符串而非时间戳；自定义格式与时区如下
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # MyBatis-Plus 配置
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: postgresql
    openai:
      # 仅作自动配置占位；运行时以「模型设置」入库加密密钥为准
      api-key: ${OPENAI_API_KEY:${DASHSCOPE_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:qwen-plus}
          temperature: 0.7
          max-tokens: 2000
          top-p: 0.9
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: 1024
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        enabled: ${ZHISHU_MCP_SERVER_ENABLED:true}
        protocol: STREAMABLE
        name: zhishu-integrable-framework
        version: 1.0.0
        type: SYNC
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
      client:
        enabled: true
        type: SYNC
        toolcallback:
          enabled: true

# JWT 配置（各环境可覆盖 secret）
jwt:
  secret: zhishu-secret-key-for-jwt-token-generation-2024
  expiration: 86400000  # 24小时（毫秒）

# SpringDoc (Swagger) 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 日志配置（控制台/文件分流策略见 logback-spring.xml）
logging:
  file:
    name: logs/zhishu-backend.log
  level:
    cn.datafuturex.zhishu.ai: INFO
    org.springframework.ai: INFO

# 业务公共配置（数据库、端口见 application-{dev|test|prod}.yml）
yunqi:
  security:
    # 是否放行 Swagger/Knife4j 文档路径；默认关闭，开发环境见 application-dev.yml
    api-docs-permit-all: false
  upload:
    path: uploads
  captcha:
    enabled: true
    expire-seconds: 120
    token-expire-seconds: 300
    tolerance: 5
  login-crypto:
    enabled: true
    key-size: 2048
    key-expire-seconds: 300
  # 伙伴 SSO（Ticket 换票）；开发默认开启，生产见 application-prod.yml
  sso:
    enabled: true
    audience: zhishu-integrable-framework
    clock-skew-seconds: 30
    jti-ttl-seconds: 180
    default-redirect: /home/dashboard
    rate-limit-window-seconds: 60
    rate-limit-max-requests: 30
    partners:
      wanxiang:
        enabled: true
        issuer: wanxiang
        display-name: 万象
        algorithm: RS256,SM2
        public-key: classpath:sso/wanxiang.pem
        public-keys:
          wanxiang-2026: classpath:sso/wanxiang.pem
        ticket-ttl-max-seconds: 120
        username-claim: username
      shuzhi-iot:
        enabled: true
        issuer: shuzhi-iot
        display-name: 数智IoT
        algorithm: RS256,SM2
        public-key: classpath:sso/shuzhi-iot.pem
        public-keys:
          shuzhi-iot-2026: classpath:sso/shuzhi-iot.pem
        ticket-ttl-max-seconds: 120
        username-claim: username
  # 月分表监控与预建（操作日志等）
  table-sharding:
    enabled: true
    strategies:
      - name: operation-log
        display-name: 操作日志
        table-prefix: sys_operation_log_
        template-table: sys_operation_log
        months-behind: 6
        months-ahead: 1
        auto-create: true

# 知枢 AI（与 zhishu-core 同进程，勿单独占用 :8180）
wanxiang:
  mcp:
    server-enabled: false
  agent:
    engine: ${WANXIANG_AGENT_ENGINE:chatclient}
  kg:
    # 默认关闭；配置 Neo4j 后设置 WANXIANG_KG_ENABLED=true 启用 GraphRAG
    enabled: ${WANXIANG_KG_ENABLED:true}
    neo4j:
      uri: ${NEO4J_URI:bolt://127.0.0.1:7687}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:12345678}
      database: ${NEO4J_DATABASE:neo4j}

zhishu:
  ai:
    # 仅用于加密入库的模型 Key，不是百炼/OpenAI 密钥。生产请覆盖。
    crypto-key: ${ZHISHU_AI_CRYPTO_KEY:zhishu-dev-model-key-wrap}
  briefing:
    event-scan:
      enabled: false
    mail:
      jdbc-enabled: false
    webhook:
      # 仅知枢内部简报可选外推，默认关闭。外部简报请自行调度并调用 /open/v1/chat
      enabled: ${ZHISHU_BRIEFING_WEBHOOK_ENABLED:false}
      url: ${ZHISHU_BRIEFING_WEBHOOK_URL:http://127.0.0.1:8180/api/v1/internal/briefings/notify}
      api-key: ${ZHISHU_BRIEFING_WEBHOOK_KEY:dev-briefing-webhook-key}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
