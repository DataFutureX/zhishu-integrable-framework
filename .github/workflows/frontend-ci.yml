name: Frontend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'zhishu-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'zhishu-frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: zhishu-frontend

jobs:
  verify:
    name: Type check / Lint / Unit test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zhishu-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit test
        run: npm run test

      - name: Build
        run: npm run build
