# 开发环境
spring:
  config:
    activate:
      on-profile: dev
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true

server:
  port: 8180

# 数据库（开发）
yunqi:
  security:
    # 开发模式：放行 API 文档相关路径
    api-docs-permit-all: true
  datasource:
    #host: 192.168.11.14
    host: 127.0.0.1
    port: 5432
    #database: letswork-dev
    database: zhishu_integrable_framework
    username: postgres
    password: mysecretpassword
    params: sslmode=disable
    pool:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    cn.datafuturex.zhishu: DEBUG
